<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <img src="assets/img/logo.png" alt="경덕중학교 로고"
            style="height: 80px; vertical-align: middle; margin-right: 15px; border-radius: 50%;">
        <h1>데이터</h1>
        <div class="auth-container">
            <span id="user-info" style="display: none; margin-right: 15px; font-weight: bold; color: white;"></span>
            <a href="admin.html" id="admin-btn" class="auth-button admin-color"
                style="display: none; text-decoration: none; margin-right: 10px;">관리자 대시보드</a>
            <button id="signup-btn" class="auth-button signup-color">Google 회원가입</button>
            <button id="login-btn" class="auth-button login-color">Google 로그인</button>
            <button id="logout-btn" class="auth-button" style="display: none;">로그아웃</button>
        </div>
    </header>

    <main>
        <!-- 선택 화면 컨테이너 -->
        <div id="selection-container">
            <h2>출제 범위 및 유형 선택</h2>



            <div class="filter-group">
                <label for="selection-type-filter">문제 유형:</label>
                <select id="selection-type-filter">
                    <option value="선택하세요">선택하세요</option>

                    <option value="multiple-choice">객관식</option>

                    <option value="essay">서술형</option>
                </select>
            </div>

            <div id="selection-message-container"></div>
            <button id="start-button" class="start-button">학습 시작하기</button>
        </div>

        <!-- 퀴즈 화면 컨테이너 (기존 컨텐츠를 이 안으로 이동) -->
        <div id="quiz-container" style="display: none;">
            <!-- 기존 문제 풀이 관련 UI -->
            <div id="question-counter">
                <span id="current-number">0</span> / <span id="total-questions">0</span>
            </div>

            <div id="question-container"></div>
            <div id="result-container"></div>

            <div class="controls">
                <button id="prev-button">이전</button>
                <button id="submit-button">제출</button>
                <button id="show-answer-button">정답 보기</button>
                <button id="next-button">다음</button>
                <button id="reset-button">범위 재선택</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 코드깎는 Kd. All rights reserved.</p>
    </footer>

    <!-- 개인정보 수집 및 이용 동의 모달 -->
    <div id="policy-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>개인정보 수집 및 이용 동의</h2>
            <div class="policy-text">
                <p>서비스 이용을 위해 아래 목적에 동의해주세요.</p>
                <ul>
                    <li><strong>수집 목적:</strong> 서비스 이용 기록 관리 및 성적 확인</li>
                    <li><strong>수집 항목:</strong> 이름, 아이디 (이메일), 퀴즈 점수</li>
                    <li><strong>보유 기간:</strong> 회원 탈퇴 시까지</li>
                </ul>
            </div>
            <div class="policy-agree">
                <input type="checkbox" id="policy-consent">
                <label for="policy-consent">위 내용을 확인하였으며 동의합니다.</label>
            </div>
            <div class="modal-buttons">
                <button id="policy-cancel-btn" class="cancel-btn">취소</button>
                <button id="policy-agree-btn" class="agree-btn">동의 및 가입</button>
            </div>
        </div>
    </div>

    <!-- 2차 비밀번호 입력 모달 -->
    <div id="password-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <h2 id="password-modal-title">2차 비밀번호 입력</h2>
            <div class="policy-text">
                <p id="password-modal-desc">서비스 이용을 위해 설정하신 2차 비밀번호를 입력해주세요.</p>
                <div style="margin-top: 15px;">
                    <input type="password" id="secondary-password-input" class="blank-input" placeholder="비밀번호"
                        style="width: 100%; border-radius: 4px; padding: 10px; border: 1px solid #ddd; background: rgba(255, 255, 255, 0.9);">
                </div>
            </div>
            <div class="modal-buttons">
                <button id="password-cancel-btn" class="cancel-btn form-btn">취소</button>
                <button id="password-submit-btn" class="agree-btn form-btn">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/script.js"></script>
    <script>
        // 마우스 포인터를 따라 배경 조명 효과
        let rafId = null;
        document.addEventListener('mousemove', (e) => {
            if (rafId) return;
            rafId = requestAnimationFrame(() => {
                const x = (e.clientX / window.innerWidth * 100).toFixed(2) + '%';
                const y = (e.clientY / window.innerHeight * 100).toFixed(2) + '%';
                document.body.style.setProperty('--mx', x);
                document.body.style.setProperty('--my', y);
                rafId = null;
            });
        });
    </script>
</body>

</html>
